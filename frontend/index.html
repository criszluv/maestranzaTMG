<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Endurecimiento del navegador: sin plugins/objetos, sin <base> ajeno,
         formularios solo al propio origen, sin iframes embebidos. La CSP
         completa (script-src/style-src) se fija en el reverse proxy al
         desplegar a producción (ver docs/PROTECCION_DATOS.md). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"
    />
    <!-- Tipografía Inter (fallback: Segoe UI / system-ui si no hay internet) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Portal MaestranzaTMG</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
